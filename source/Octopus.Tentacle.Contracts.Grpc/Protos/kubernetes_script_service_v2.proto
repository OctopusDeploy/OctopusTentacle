syntax = "proto3";
package octopus.tentacle.contracts.grpc;

import "start_kubernetes_script_command_v2.proto";
import "kubernetes_script_status_response_v2.proto";

option csharp_namespace = "Octopus.Tentacle.Contracts.Grpc";

service KubernetesScriptServiceV2 {
  rpc StartScript(stream KubernetesScriptStatusResponseV2) returns (stream StartKubernetesScriptCommandV2);
}