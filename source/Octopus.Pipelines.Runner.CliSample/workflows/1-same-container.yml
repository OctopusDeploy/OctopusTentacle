# Scenario 1: every step runs in the job's container.
# generate writes an output, decide reads it and writes another, deploy runs only if decide said so.
# Each step prints the container it ran in, and whether it can see the file generate left in /tmp.
name: same-container
on: workflow_dispatch

jobs:
  release:
    runs-on: ubuntu-latest
    container: alpine:3.20
    env:
      RELEASE_VERSION: 1.4.0
    steps:
      - id: generate
        name: Generate version
        run: |
          echo "container $(hostname): $(grep -s ^PRETTY_NAME= /etc/os-release | cut -d'"' -f2)"
          touch /tmp/from-generate
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "version is $RELEASE_VERSION"

      - id: decide
        name: Decide whether to deploy
        env:
          VERSION: ${{ steps.generate.outputs.version }}
        run: |
          echo "container $(hostname): $(grep -s ^PRETTY_NAME= /etc/os-release | cut -d'"' -f2)"
          if [ -e /tmp/from-generate ]; then echo "/tmp still has generate's file"; else echo "/tmp is fresh"; fi
          case "$VERSION" in
            0.*) deploy=false ;;
            *)   deploy=true ;;
          esac
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
          {
            echo "notes<<EOF"
            echo "Release $VERSION"
            echo "deploy: $deploy"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "deploy is $deploy"

      - id: deploy
        name: Deploy
        if: steps.decide.outputs.deploy == 'true'
        env:
          VERSION: ${{ steps.generate.outputs.version }}
          NOTES: ${{ steps.decide.outputs.notes }}
        run: |
          echo "container $(hostname): $(grep -s ^PRETTY_NAME= /etc/os-release | cut -d'"' -f2)"
          if [ -e /tmp/from-generate ]; then echo "/tmp still has generate's file"; else echo "/tmp is fresh"; fi
          echo "deploying ${{ steps.generate.outputs.version }}"
          printf '%s\n' "$NOTES"
