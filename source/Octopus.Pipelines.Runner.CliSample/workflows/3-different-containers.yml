# Scenario 3: every step runs in a different image, and the job has no container of its own.
name: different-containers
on: workflow_dispatch

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: 1.4.0
    steps:
      - id: generate
        name: Generate version
        container: debian:bookworm-slim
        run: |
          echo "container $(hostname): $(grep -s ^PRETTY_NAME= /etc/os-release | cut -d'"' -f2)"
          echo "built by generate" > release.txt
          echo "version=$RELEASE_VERSION" >> "$OCTOPUS_OUTPUT"
          echo "version is $RELEASE_VERSION"

      - id: decide
        name: Decide whether to deploy
        container: python:3.12-alpine
        env:
          VERSION: ${{ steps.generate.outputs.version }}
        run: |
          echo "container $(hostname): $(python3 --version)"
          echo "workspace has: $(cat release.txt)"
          python3 - <<'PY'
          import os
          major = int(os.environ["VERSION"].split(".")[0])
          deploy = "true" if major >= 1 else "false"
          with open(os.environ["OCTOPUS_OUTPUT"], "a") as out:
              out.write(f"deploy={deploy}\n")
              out.write(f"notes<<EOF\nRelease {os.environ['VERSION']}\ndeploy: {deploy}\nEOF\n")
          print(f"deploy is {deploy}")
          PY

      - id: deploy
        name: Deploy
        container: alpine:3.20
        if: steps.decide.outputs.deploy == 'true'
        env:
          VERSION: ${{ steps.generate.outputs.version }}
          NOTES: ${{ steps.decide.outputs.notes }}
        run: |
          echo "container $(hostname): $(grep -s ^PRETTY_NAME= /etc/os-release | cut -d'"' -f2)"
          echo "workspace has: $(cat release.txt)"
          echo "deploying ${{ steps.generate.outputs.version }}"
          printf '%s\n' "$NOTES"
