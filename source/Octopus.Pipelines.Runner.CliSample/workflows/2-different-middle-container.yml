# Scenario 2: the job's container runs generate and deploy; decide runs in a Python image of its own.
# GitHub Actions has no `container:` on a run step (the nearest is a `uses: docker://` step); here it overrides the
# job's container for that step.
name: different-middle-container
on: workflow_dispatch

jobs:
  release:
    runs-on: ubuntu-latest
    container: alpine:3.20
    env:
      RELEASE_VERSION: 1.4.0
    steps:
      - id: generate
        name: Generate version
        run: |
          echo "container $(hostname): $(grep -s ^PRETTY_NAME= /etc/os-release | cut -d'"' -f2)"
          touch /tmp/from-generate
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "version is $RELEASE_VERSION"

      - id: decide
        name: Decide whether to deploy
        container: python:3.12-alpine
        env:
          VERSION: ${{ steps.generate.outputs.version }}
        run: |
          echo "container $(hostname): $(python3 --version)"
          if [ -e /tmp/from-generate ]; then echo "/tmp still has generate's file"; else echo "/tmp is fresh"; fi
          python3 - <<'PY'
          import os
          major = int(os.environ["VERSION"].split(".")[0])
          deploy = "true" if major >= 1 else "false"
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"deploy={deploy}\n")
              out.write(f"notes<<EOF\nRelease {os.environ['VERSION']}\ndeploy: {deploy}\nEOF\n")
          print(f"deploy is {deploy}")
          PY

      - id: deploy
        name: Deploy
        if: steps.decide.outputs.deploy == 'true'
        env:
          VERSION: ${{ steps.generate.outputs.version }}
          NOTES: ${{ steps.decide.outputs.notes }}
        run: |
          echo "container $(hostname): $(grep -s ^PRETTY_NAME= /etc/os-release | cut -d'"' -f2)"
          if [ -e /tmp/from-generate ]; then echo "/tmp still has generate's file"; else echo "/tmp is fresh"; fi
          echo "deploying ${{ steps.generate.outputs.version }}"
          printf '%s\n' "$NOTES"
