// The runner gateway contract, and its only copy. Octopus Server and the runner hosts all use the C# that Grpc.Tools
// generates from it, shipped in the Octopus.Pipelines.Runner.Contracts package. Never renumber a field; reserve the
// numbers and names of removed ones.
syntax = "proto3";

package targetscalepoc.v1;

option csharp_namespace = "Octopus.Pipelines.Runner.Contracts";

import "google/protobuf/timestamp.proto";

// Runners dial OUT to the Server cell and hold one bidirectional stream open.
// The Server never connects to a runner, so runner cells need no inbound
// networking (matching the Tentacle-polling style).
//
// Runners pull work: a runner sends AllocateNextJobCommand when it decides it can take
// more, and the Server sends at most that many ExecuteJobCommand messages. The Server
// never decides how much a runner can handle, so the runner can base requests
// on anything it can observe (today a fixed limit, later how busy its cluster is).
service RunnerGateway {
  rpc Connect(stream RunnerMessage) returns (stream ServerMessage);
}

message RunnerMessage {
  oneof body {
    Hello hello = 1;
    JobStartedEvent job_started = 2;
    MarkJobAsFinishedCommand mark_job_as_finished = 3;
    Heartbeat heartbeat = 4;
    AllocateNextJobCommand allocate_next_job = 5;
    StepFinishedEvent step_finished = 6;
  }
}

message ServerMessage {
  oneof body {
    Welcome welcome = 1;
    ExecuteJobCommand execute_job = 2;
    Heartbeat heartbeat = 3;
    CancelJobCommand cancel_job = 5;
  }
  reserved 4;
}

// Sent by the Server on an interval and echoed back by the runner. Keeps both directions of the
// stream busy so idle-timeout proxies (App Service's front end drops requests idle for about 230s,
// Azure Load Balancer after 4 minutes) don't cut it, and lets the runner notice a dead Server.
message Heartbeat {
  google.protobuf.Timestamp sent_at = 1;
}

message Hello {
  string cell_id = 1;
  string runner_id = 2;
  // Was max_concurrent_jobs. Runners now say how much they can take with AllocateNextJobCommand.
  reserved 3;
  reserved "max_concurrent_jobs";
  // Jobs this runner is still executing from a previous (dropped) stream, so
  // the Server can re-adopt them instead of marking them lost.
  repeated string in_flight_job_ids = 4;
}

// Asks for up to `count` more jobs on this stream. Requests add up and stay open until the
// Server has sent that many jobs: while the queue is empty the Server holds them, like a long
// poll. They belong to the stream, so after a reconnect the runner starts again from zero.
message AllocateNextJobCommand {
  int32 count = 1;
}

message Welcome {
  string server_id = 1;
}

message ExecuteJobCommand {
  string job_id = 1;
  string run_id = 2;
  // Shell command executed with `sh -c` inside the job container. Ignored when the job has steps.
  string command = 3;
  reserved 4;
  JobIsolation isolation = 5;
  JobStorage storage = 6;
  // The job's steps, run one at a time. Each runs, by exec, in a container kept for its image: steps that share an
  // image share a container, and the container is removed after the last step that needs it.
  repeated Step steps = 7;
  // Were the job's env and secrets. They're in each step's payload now.
  reserved 8, 9;
  reserved "env", "secrets";
  // Containers that run alongside every step, reachable from the steps by name.
  repeated Service services = 10;
  // The image of steps that don't name one. Empty means the runner's default.
  string image = 11;
  // Credentials for the private registries the job's images come from.
  repeated RegistryCredential registry_credentials = 12;
  // How long the whole job may run before it's cancelled. 0 means no limit.
  int32 timeout_seconds = 13;
}

// A step. The runner reads only what it needs to run it; what the step does is in `payload`, which the runner passes
// to the step runner untouched. The Server picks a step runner version that reads the payload it sends.
message Step {
  // Unique within the job. Results are reported under it.
  string id = 1;
  // Were the step's name, script, condition, env and shell. They're in `payload` now.
  reserved 2, 3, 4, 6, 7;
  reserved "name", "run", "condition", "env", "shell";
  // The image to run the step in. Empty means the job's.
  string image = 5;
  // How long the step may run before the runner stops it and fails it. 0 means no limit.
  int32 timeout_seconds = 8;
  // The image the step runner comes from: its /step-runner is extracted and run in the step's container.
  string step_runner_image = 9;
  // For the step runner only.
  string payload = 10;
}

message Service {
  // The host name steps reach the service by.
  string name = 1;
  // Runs with its own entrypoint and command.
  string image = 2;
  map<string, string> env = 3;
  // A command run in the service's container until it succeeds; steps start after that. Empty means "once running".
  repeated string readiness_command = 4;
}

message RegistryCredential {
  // e.g. ghcr.io, or docker.io for Docker Hub.
  string registry = 1;
  string username = 2;
  string password = 3;
}

// Stops a running job. The running step is stopped, and later steps run only if their conditions allow it after a
// cancellation (e.g. always()), as in GitHub Actions. `force` stops everything at once. Ignored for a job the runner
// isn't running.
message CancelJobCommand {
  string job_id = 1;
  bool force = 2;
}

// How strongly a job is separated from other jobs on the same node. Every job gets the cell's
// baseline hardening (no network, non-root, user namespaces, resource limits); SANDBOXED also
// runs it in its own lightweight VM with its own kernel (AKS Pod Sandboxing, Kata).
// UNSPECIFIED is treated as STANDARD so older Servers keep working.
enum JobIsolation {
  JOB_ISOLATION_UNSPECIFIED = 0;
  JOB_ISOLATION_STANDARD = 1;
  JOB_ISOLATION_SANDBOXED = 2;
}

// Where the job's files go: its own directory in the customer's container, chosen by the Server
// (customer placement is a Server concern); file content never flows through the Server cell.
message JobStorage {
  string storage_cell_id = 1;
  // https://<account>.blob.core.windows.net/c-<customer>/runs/<run>/<job>?<sas> in Azure: a user
  // delegation SAS that can create and append blobs under this directory and nothing else, valid
  // for longer than the longest job. file:///<root>/c-<customer>/runs/<run>/<job> for local
  // disk, with no query. Runners have no storage role of their own.
  string directory_uri = 2;
}

message JobStartedEvent {
  string job_id = 1;
  google.protobuf.Timestamp started_at = 2;
}

enum JobOutcome {
  JOB_OUTCOME_UNSPECIFIED = 0;
  JOB_OUTCOME_SUCCEEDED = 1;
  JOB_OUTCOME_FAILED = 2;
  // Stopped by a CancelJobCommand or the job's timeout.
  JOB_OUTCOME_CANCELLED = 3;
  // The runner couldn't run the job, e.g. an image couldn't be pulled; `error` says why.
  JOB_OUTCOME_ERRORED = 4;
}

message MarkJobAsFinishedCommand {
  string job_id = 1;
  JobOutcome outcome = 2;
  int32 exit_code = 3;
  google.protobuf.Timestamp completed_at = 4;
  int64 log_bytes = 5;
  string error = 6;
  // How each step ended, in order. Empty for a single-command job.
  repeated StepResult steps = 7;
}

enum StepOutcome {
  STEP_OUTCOME_UNSPECIFIED = 0;
  STEP_OUTCOME_SUCCESS = 1;
  STEP_OUTCOME_FAILURE = 2;
  STEP_OUTCOME_SKIPPED = 3;
  // Stopped before it finished, by a timeout or a cancellation.
  STEP_OUTCOME_CANCELLED = 4;
}

message StepResult {
  string id = 1;
  StepOutcome outcome = 2;
  // Absent when the step was skipped.
  optional int32 exit_code = 3;
  // What the step wrote to $OCTOPUS_OUTPUT, less any output that contains a secret.
  map<string, string> outputs = 4;
  // Why the step failed other than by its script's exit code, e.g. a timeout.
  string error = 5;
  google.protobuf.Timestamp started_at = 6;
  google.protobuf.Timestamp finished_at = 7;
}

// Sent as each step finishes, before the job's MarkJobAsFinishedCommand.
message StepFinishedEvent {
  string job_id = 1;
  StepResult result = 2;
}
